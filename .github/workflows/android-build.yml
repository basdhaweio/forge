name: Android Build

# Same pattern as the Library app: CI builds the debug APK on every push that touches the app and keeps the newest
# one at a fixed, phone-friendly URL:
#   https://github.com/basdhaweio/forge/releases/download/android-latest/forge.apk
# Web changes (js/, css/, data/) never trigger this — the app loads the live site.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk forge.apk
          gh release create android-latest --title "Forge (latest Android build)" \
            --notes "Rolling debug build, replaced automatically by CI on every push to android/." \
            || true
          gh release upload android-latest forge.apk --clobber
